# ===================================
#  Form Field Definitions
# ===================================

fields:
    section:
        label: xitara.erecht24::lang.settings.section.label
        comment: xitara.erecht24::lang.settings.section.comment
        type: section
        span: full

tabs:
    fields:
        section_api:
            label: xitara.erecht24::lang.settings.section_api.label
            comment: xitara.erecht24::lang.settings.section_api.comment
            tab: xitara.erecht24::lang.settings.tab.section_api
            type: section
            span: full
        use_demo_credentials:
            label: xitara.erecht24::lang.settings.use_demo_credentials.label
            comment: xitara.erecht24::lang.settings.use_demo_credentials.comment
            tab: xitara.erecht24::lang.settings.tab.section_api
            type: switch
            default: false
            span: full
        apikey:
            label: xitara.erecht24::lang.settings.apikey.label
            comment: xitara.erecht24::lang.settings.apikey.comment
            tab: xitara.erecht24::lang.settings.tab.section_api
            type: text
            span: auto
            trigger:
                action: disable
                field: use_demo_credentials
                condition: checked
        test_apikey:
            label: xitara.erecht24::lang.settings.test_apikey.label
            comment: xitara.erecht24::lang.settings.test_apikey.comment
            tab: xitara.erecht24::lang.settings.tab.section_api
            type: partial
            path: $/xitara/erecht24/models/settings/_test_apikey.htm
            span: auto
        docs:
            label: xitara.erecht24::lang.settings.docs.label
            comment: xitara.erecht24::lang.settings.docs.comment
            tab: xitara.erecht24::lang.settings.tab.section_api
            type: checkboxlist
            quickselect: true
            options:
                imprint: Impressum
                privacyPolicy: Datenschutzerklärung
                privacyPolicySocialMedia: Datenschutzerklärung Social-Media
            span: auto
        langs:
            label: xitara.erecht24::lang.settings.langs.label
            comment: xitara.erecht24::lang.settings.langs.comment
            tab: xitara.erecht24::lang.settings.tab.section_api
            type: checkboxlist
            quickselect: true
            options:
                de: deutsch
                en: englisch
            span: auto

        section_poll:
            label: xitara.erecht24::lang.settings.section_poll.label
            comment: xitara.erecht24::lang.settings.section_poll.comment
            tab: xitara.erecht24::lang.settings.tab.section_poll
            type: section
            span: full
        interval:
            label: xitara.erecht24::lang.settings.interval.label
            comment: xitara.erecht24::lang.settings.interval.comment
            tab: xitara.erecht24::lang.settings.tab.section_poll
            type: dropdown
            options:
                daily: xitara.erecht24::lang.settings.daily
                weekly: xitara.erecht24::lang.settings.weekly
                monthly: xitara.erecht24::lang.settings.monthly
            default: weekly
            span: auto
        is_pull_active:
            label: xitara.erecht24::lang.settings.is_pull_active.label
            comment: xitara.erecht24::lang.settings.is_pull_active.comment
            tab: xitara.erecht24::lang.settings.tab.section_poll
            type: switch
            span: auto
        pull_now:
            label: xitara.erecht24::lang.settings.pull_now.label
            comment: xitara.erecht24::lang.settings.pull_now.comment
            tab: xitara.erecht24::lang.settings.tab.section_poll
            type: partial
            path: $/xitara/erecht24/models/settings/_pull_now.htm
            span: auto

        section_push:
            label: xitara.erecht24::lang.settings.section_push.label
            comment: xitara.erecht24::lang.settings.section_push.comment
            tab: xitara.erecht24::lang.settings.tab.section_push
            type: section
            span: full
        push_uri:
            label: xitara.erecht24::lang.settings.push_uri.label
            comment: xitara.erecht24::lang.settings.push_uri.comment
            tab: xitara.erecht24::lang.settings.tab.section_push
            type: text
            span: full
        is_push_active:
            label: xitara.erecht24::lang.settings.is_push_active.label
            comment: xitara.erecht24::lang.settings.is_push_active.comment
            tab: xitara.erecht24::lang.settings.tab.section_push
            type: switch
            disabled: true
            span: auto
        push_client_id:
            label: xitara.erecht24::lang.settings.push_client_id.label
            comment: xitara.erecht24::lang.settings.push_client_id.comment
            tab: xitara.erecht24::lang.settings.tab.section_push
            type: text
            disabled: true
            span: auto
        push_test_type:
            label: xitara.erecht24::lang.settings.push_test_type.label
            comment: xitara.erecht24::lang.settings.push_test_type.comment
            tab: xitara.erecht24::lang.settings.tab.section_push
            type: dropdown
            default: ping
            options:
                ping: xitara.erecht24::lang.settings.push_test_types.ping
                message: xitara.erecht24::lang.settings.push_test_types.message
                imprint: xitara.erecht24::lang.settings.push_test_types.imprint
                privacyPolicy: xitara.erecht24::lang.settings.push_test_types.privacy_policy
                privacyPolicySocialMedia: xitara.erecht24::lang.settings.push_test_types.privacy_policy_social_media
            span: auto
        registered_clients:
            label: xitara.erecht24::lang.settings.registered_clients.label
            comment: xitara.erecht24::lang.settings.registered_clients.comment
            tab: xitara.erecht24::lang.settings.tab.section_push
            type: textarea
            size: small
            disabled: true
            span: full
        push_actions:
            label: xitara.erecht24::lang.settings.push_actions.label
            comment: xitara.erecht24::lang.settings.push_actions.comment
            tab: xitara.erecht24::lang.settings.tab.section_push
            type: partial
            path: $/xitara/erecht24/models/settings/_push_actions.htm
            span: full
