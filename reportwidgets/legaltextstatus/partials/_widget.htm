<div class="report-widget">
    <h3><?= e(trans($this->property('title'))) ?></h3>

    <?php if (!isset($error)): ?>
        <div class="control-status-list">
            <ul>
                <?php if (!$rows): ?>
                    <li>
                        <span class="status-icon warning"><i class="icon-exclamation"></i></span>
                        <span class="status-text warning">
                            <?= e(trans('xitara.erecht24::lang.dashboard.no_documents')) ?>
                        </span>
                    </li>
                <?php endif ?>

                <?php foreach ($rows as $row): ?>
                    <li>
                        <?php if ($row['state'] === 'current'): ?>
                            <span class="status-icon success"><i class="icon-check"></i></span>
                            <span class="status-text success">
                                <?= e(trans('xitara.erecht24::lang.dashboard.current', ['document' => $row['label']])) ?>
                            </span>
                        <?php else: ?>
                            <span class="status-icon warning"><i class="icon-exclamation"></i></span>
                            <span class="status-text warning">
                                <?= e(trans('xitara.erecht24::lang.dashboard.warning', ['document' => $row['label']])) ?>
                            </span>
                            <a
                                href="javascript:;"
                                data-control="popup"
                                data-size="large"
                                data-handler="<?= $this->getEventHandler('onLoadWarningsForm') ?>"
                                class="status-label link"><?= e(trans('xitara.erecht24::lang.dashboard.inspect')) ?></a>
                        <?php endif ?>
                    </li>
                <?php endforeach ?>
            </ul>
        </div>
    <?php else: ?>
        <div class="callout callout-warning">
            <div class="content"><?= e($error) ?></div>
        </div>
    <?php endif ?>
</div>
